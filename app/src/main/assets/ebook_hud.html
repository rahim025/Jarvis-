<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier e-book</title>
<style>
:root{
  --void:#050810; --panel:#0a111e; --line:rgba(98,240,255,.16); --line-strong:rgba(98,240,255,.38);
  --reactor:#62f0ff; --armor:#ffbf47; --alert:#ff5a4a; --dim:#5b6b82; --text:#e6f4fa; --muted:#8fa3b8;
  --cond:"Rajdhani","Barlow Condensed","sans-serif-condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,"Roboto Mono",monospace;
  --accent:var(--reactor);
}
body.done{--accent:var(--armor)}
body.error{--accent:var(--alert)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--void);color:var(--text);font-family:var(--cond);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 18px calc(96px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 60% at 50% -5%,rgba(98,240,255,.10),transparent 60%),var(--void)}
body.done{background:radial-gradient(120% 60% at 50% -5%,rgba(255,191,71,.10),transparent 60%),var(--void)}
body.error{background:radial-gradient(120% 60% at 50% -5%,rgba(255,90,74,.12),transparent 60%),var(--void)}

/* barre d'état */
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;font-size:15px;color:var(--muted)}
.bar .id{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:600;font-size:17px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.lost .dot{background:var(--armor);box-shadow:0 0 10px var(--armor);animation:blink 1s steps(2) infinite}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* réacteur */
.reactor{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:8px auto 4px}
.reactor svg{width:100%;height:100%;overflow:visible}
.spin-a{transform-origin:120px 120px;animation:spin 46s linear infinite}
.spin-b{transform-origin:120px 120px;animation:spin 28s linear infinite reverse}
.pulse{transform-origin:120px 120px;animation:pulse 3.2s ease-in-out infinite}
body.done .spin-a,body.done .spin-b,body.done .pulse,body.error .spin-a,body.error .spin-b,body.error .pulse{animation-play-state:paused}
.stroke-accent{stroke:var(--accent);transition:stroke .6s}
.fill-accent{fill:var(--accent);transition:fill .6s}
#arc,#miniArc{transition:stroke-dashoffset .9s cubic-bezier(.3,.7,.2,1);filter:drop-shadow(0 0 6px var(--accent))}
.pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pct b{font-size:62px;font-weight:300;line-height:.9;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.pct i{font-style:normal;font-size:15px;color:var(--muted);margin-top:4px}

/* mini-barre fixe : visible quand le grand réacteur est hors écran */
.mini{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:12px;padding:8px 18px;
  background:#050810;border-bottom:1px solid var(--line-strong);transform:translateY(-105%);transition:transform .3s}
.mini.on{transform:none}
.mini svg{width:34px;height:34px;flex:none}
.mini .mp{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;min-width:48px}
.mini .ms{flex:1;min-width:0;font-size:16px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .clock{flex:none}

/* titre + télémétrie */
.head{text-align:center;margin:2px 0 18px}
.head h1{margin:0;font-size:25px;font-weight:600;line-height:1.15;color:var(--armor);text-wrap:balance}
.head .telemetry{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.status{margin-top:8px;font-size:16px;color:var(--accent);min-height:20px}

/* sections */
h2{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}

/* pipeline */
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:1px;background:var(--line)}
.step{position:relative;display:grid;grid-template-columns:24px 1fr;column-gap:12px;padding:9px 0;opacity:.55;transition:opacity .4s}
.step.active,.step.done,.step.error{opacity:1}
.glyph{width:24px;height:24px;display:grid;place-items:center;background:var(--void);position:relative;z-index:1}
.glyph svg{width:20px;height:20px}
.step .label{font-size:18px;line-height:1.2;font-weight:500}
.step .detail{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35;word-break:break-word}
.step.done .label{color:var(--text)}
.step.active .label{color:var(--armor)}
.step.error .label{color:var(--alert)}
.step.active::after{content:"";position:absolute;left:36px;right:0;bottom:2px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--armor),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sweep 1.5s ease-in-out infinite}
.spinner{transform-origin:10px 10px;animation:spin .9s linear infinite}

/* journal */
.log{font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--muted);min-height:60px;
  border-left:1px solid var(--line-strong);padding:2px 0 2px 12px}
.log div{white-space:pre-wrap;word-break:break-word}
.log div:last-child{color:var(--text)}
.log time{color:var(--dim);margin-right:8px}
.log .caret::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}

/* couverture */
.cover{display:none;margin-top:6px}
.cover.show{display:block}
.holo{position:relative;width:min(62vw,250px);aspect-ratio:2/3;margin:6px auto 0;border:1px solid var(--line-strong);
  background:var(--panel);box-shadow:0 0 28px rgba(98,240,255,.14);clip-path:inset(0 0 100% 0)}
body.done .holo{box-shadow:0 0 28px rgba(255,191,71,.18)}
.cover.show .holo{animation:reveal 1.6s cubic-bezier(.5,.1,.2,1) forwards}
.holo img{width:100%;height:100%;display:block;object-fit:cover}
.holo::before,.holo::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--accent);z-index:2}
.holo::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.holo::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.scan{position:absolute;left:0;right:0;height:3px;z-index:3;background:var(--reactor);box-shadow:0 0 14px var(--reactor);top:0;opacity:0}
.cover.show .scan{animation:scan 1.6s cubic-bezier(.5,.1,.2,1) forwards}
.cover .cap{text-align:center;font-size:14px;color:var(--muted);margin-top:10px}

/* erreur */
.alert{display:none;margin:14px 0 0;padding:12px 14px;border:1px solid var(--alert);background:rgba(255,90,74,.08);color:#ffd9d4;font-size:16px;line-height:1.3}
body.error .alert{display:block}

/* actions */
.actions{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent,var(--void) 38%);z-index:5}
button{flex:1;font:600 17px var(--cond);color:var(--text);background:rgba(10,17,30,.92);border:1px solid var(--line-strong);padding:13px 10px;border-radius:2px;
  display:none;touch-action:manipulation}
button:active{background:rgba(98,240,255,.14)}
button.primary{background:var(--armor);color:#1a1204;border-color:var(--armor)}
button.primary:active{background:#ffd27a}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.running #btn-cancel,
body.done #btn-open,body.done #btn-share,body.done #btn-png,
body.error #btn-retry,body.error #btn-close,body.cancelled #btn-retry,body.cancelled #btn-close{display:block}
body.done .actions{flex-wrap:wrap}
body.done{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
body.done #btn-open{flex-basis:100%}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:var(--panel);border:1px solid var(--line-strong);padding:9px 14px;font-size:15px;z-index:9;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
@keyframes blink{50%{opacity:.2}}
@keyframes sweep{0%{background-position:-60% 0}100%{background-position:160% 0}}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes scan{0%{top:0;opacity:1}92%{opacity:1}100%{top:calc(100% - 3px);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .spin-a,.spin-b,.pulse,.spinner,.step.active::after,.cover.show .scan{animation:none}
  .cover.show .holo{animation:none;clip-path:none}
  #arc,#miniArc{transition:none}
}
</style>
</head>
<body class="running">

<div class="mini" id="mini" aria-hidden="true">
  <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(98,240,255,.16)" stroke-width="4"/>
    <circle id="miniArc" cx="20" cy="20" r="16" fill="none" stroke-width="4" class="stroke-accent" transform="rotate(-90 20 20)" stroke-dasharray="100.53" stroke-dashoffset="100.53"/></svg>
  <span class="mp" id="miniPct">0%</span><span class="ms" id="miniStatus">…</span><span class="clock" id="miniClock">00:00</span>
</div>
<div class="bar">
  <div class="id"><span class="dot"></span><span>Atelier e-book</span></div>
  <div class="clock" id="clock">00:00</div>
</div>

<section class="head">
  <div class="reactor">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <g class="spin-a">
        <circle cx="120" cy="120" r="114" fill="none" stroke-width="1" class="stroke-accent" opacity=".35"/>
        <g id="ticks" class="stroke-accent" stroke-width="2" opacity=".55"></g>
      </g>
      <g class="spin-b">
        <circle cx="120" cy="120" r="96" fill="none" stroke-width="3" stroke-dasharray="46 20 8 20" class="stroke-accent" opacity=".35"/>
      </g>
      <circle cx="120" cy="120" r="80" fill="none" stroke="rgba(98,240,255,.12)" stroke-width="9"/>
      <circle id="arc" cx="120" cy="120" r="80" fill="none" stroke-width="9" stroke-linecap="butt" class="stroke-accent"
        transform="rotate(-90 120 120)" stroke-dasharray="502.65" stroke-dashoffset="502.65"/>
      <g class="pulse" id="coils" opacity=".5"></g>
      <circle cx="120" cy="120" r="56" fill="rgba(5,8,16,.7)" stroke-width="1" class="stroke-accent" opacity=".6"/>
    </svg>
    <div class="pct"><b id="pct">0</b><i>%</i></div>
  </div>
  <h1 id="title">…</h1>
  <div class="telemetry" id="telemetry">Initialisation</div>
  <div class="status" id="status">Liaison avec le serveur…</div>
</section>

<div class="alert" id="alert" role="alert"></div>

<div class="cover" id="cover">
  <h2>Couverture</h2>
  <div class="holo"><img id="coverImg" alt="Couverture de l'e-book"><div class="scan"></div></div>
  <div class="cap" id="coverCap">Couverture composée</div>
</div>

<h2>Étapes</h2>
<ul class="steps" id="steps"></ul>

<h2>Journal</h2>
<div class="log" id="log"></div>

<div class="actions">
  <button id="btn-cancel" type="button">Annuler la création</button>
  <button id="btn-open" class="primary" type="button">Ouvrir l'e-book</button>
  <button id="btn-share" type="button">Partager</button>
  <button id="btn-png" type="button">Couverture PNG</button>
  <button id="btn-retry" class="primary" type="button">Réessayer</button>
  <button id="btn-close" type="button">Fermer</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};
  var C = 2 * Math.PI * 80;
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // décor du réacteur
  (function(){
    var t = $('#ticks'), i, a, l;
    for (i = 0; i < 60; i++) {
      a = i * 6 * Math.PI / 180; l = document.createElementNS(NS, 'line');
      var long = i % 5 === 0, r1 = long ? 104 : 108;
      l.setAttribute('x1', 120 + Math.cos(a) * r1); l.setAttribute('y1', 120 + Math.sin(a) * r1);
      l.setAttribute('x2', 120 + Math.cos(a) * 113); l.setAttribute('y2', 120 + Math.sin(a) * 113);
      t.appendChild(l);
    }
    var c = $('#coils');
    for (i = 0; i < 10; i++) {
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', 114); r.setAttribute('y', 52); r.setAttribute('width', 12); r.setAttribute('height', 18); r.setAttribute('rx', 2);
      r.setAttribute('transform', 'rotate(' + (i * 36) + ' 120 120)'); r.setAttribute('class', 'fill-accent'); c.appendChild(r);
    }
  })();

  var shownPct = 0, targetPct = 0, rafId = 0;
  function tween(){
    if (shownPct === targetPct) { rafId = 0; return; }
    shownPct += Math.sign(targetPct - shownPct) * Math.max(1, Math.abs(targetPct - shownPct) * 0.12);
    if (Math.abs(targetPct - shownPct) < 1) shownPct = targetPct;
    $('#pct').textContent = Math.round(shownPct);
    rafId = requestAnimationFrame(tween);
  }
  function setPct(p){
    targetPct = Math.max(0, Math.min(100, p));
    $('#arc').style.strokeDashoffset = C * (1 - targetPct / 100);
    $('#miniArc').style.strokeDashoffset = 100.53 * (1 - targetPct / 100);
    $('#miniPct').textContent = Math.round(targetPct) + '%';
    if (reduce) { shownPct = targetPct; $('#pct').textContent = Math.round(targetPct); }
    else if (!rafId) rafId = requestAnimationFrame(tween);
  }

  var GLYPH = {
    pending: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.5" fill="none" stroke="#5b6b82" stroke-width="1.6"/></svg>',
    active: '<svg viewBox="0 0 20 20"><g class="spinner"><path d="M10 2.5a7.5 7.5 0 0 1 7.5 7.5" fill="none" stroke="#ffbf47" stroke-width="2.4" stroke-linecap="round"/></g><circle cx="10" cy="10" r="2.2" fill="#ffbf47"/></svg>',
    done: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#62f0ff" stroke-width="1.6"/><path d="M6 10.4l2.8 2.8L14.2 7.4" fill="none" stroke="#62f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    error: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#ff5a4a" stroke-width="1.6"/><path d="M7 7l6 6M13 7l-6 6" stroke="#ff5a4a" stroke-width="2" stroke-linecap="round"/></svg>'
  };

  var rows = {};
  function renderSteps(steps){
    var list = $('#steps'), activeEl = null;
    steps.forEach(function(s){
      var el = rows[s.id];
      if (!el) {
        el = document.createElement('li'); el.className = 'step'; el.dataset.state = '';
        el.innerHTML = '<div class="glyph"></div><div><div class="label"></div><div class="detail"></div></div>';
        list.appendChild(el); rows[s.id] = el;
      }
      if (el.dataset.state !== s.state) {
        el.dataset.state = s.state; el.className = 'step ' + s.state;
        el.querySelector('.glyph').innerHTML = GLYPH[s.state] || GLYPH.pending;
      }
      el.querySelector('.label').textContent = s.label;
      el.querySelector('.detail').textContent = s.detail || '';
      if (s.state === 'active') activeEl = el;
    });
    if (activeEl && activeEl !== HUD._lastActive) {
      HUD._lastActive = activeEl;
      var r = activeEl.getBoundingClientRect();
      if (r.bottom > innerHeight - 130 || r.top < 70) activeEl.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'center'});
    }
  }

  var typing = null;
  function addLog(entries){
    var box = $('#log');
    entries.forEach(function(e){
      if (HUD._seen[e.n]) return; HUD._seen[e.n] = 1;
      var d = document.createElement('div'), m = Math.floor(e.t / 60), s = e.t % 60;
      var stamp = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      var t = document.createElement('time'); t.textContent = stamp; d.appendChild(t);
      var span = document.createElement('span'); d.appendChild(span);
      box.appendChild(d);
      while (box.children.length > 7) box.removeChild(box.firstChild);
      if (typing) { clearInterval(typing.id); typing.span.textContent = typing.text; typing.row.classList.remove('caret'); typing = null; }
      if (reduce || entries.length > 3) { span.textContent = e.msg; }
      else {
        var i = 0, text = e.msg; d.classList.add('caret'); typing = {span: span, text: text, row: d};
        typing.id = setInterval(function(){ i += 2; span.textContent = text.slice(0, i); if (i >= text.length) { clearInterval(typing.id); d.classList.remove('caret'); typing = null; } }, 16);
      }
    });
  }

  var clockStart = Date.now(), clockBase = 0, clockTimer = null;
  function fmt(sec){ var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function tick(){ var t = fmt(clockBase + Math.floor((Date.now() - clockStart) / 1000)); $('#clock').textContent = t; $('#miniClock').textContent = t; }
  function startClock(){ if (!clockTimer) { clockStart = Date.now(); clockTimer = setInterval(tick, 1000); } }
  function stopClock(sec){ if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } $('#clock').textContent = fmt(sec || 0); $('#miniClock').textContent = fmt(sec || 0); }

  function nativeCall(name, arg){
    try { if (window.Native && Native[name]) return arg === undefined ? Native[name]() : Native[name](arg); } catch (e) {}
  }
  var toastTimer;
  function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600); }

  var HUD = window.HUD = {
    _seen: {}, _lastActive: null, _cover: '',
    init: function(o){
      $('#title').textContent = (o && o.topic) || '…';
      document.body.className = 'running'; startClock();
    },
    update: function(s){
      var phase = s.status === 'running' ? 'running' : s.status;
      document.body.className = phase + (document.body.classList.contains('lost') ? ' lost' : '');
      $('#title').textContent = s.title || s.topic || '…';
      setPct(s.status === 'done' ? 100 : s.progress || 0);
      renderSteps(s.steps || []);
      addLog(s.log || []);
      var chs = (s.steps || []).filter(function(x){ return /^ch\d+$/.test(x.id); });
      var doneCh = chs.filter(function(x){ return x.state === 'done'; }).length;
      $('#telemetry').textContent = chs.length ? 'Chapitres ' + doneCh + '/' + chs.length + '  ·  ' + ((s.stats && s.stats.words) || 0).toLocaleString('fr-FR') + ' mots' : 'Préparation du plan';
      var active = (s.steps || []).filter(function(x){ return x.state === 'active'; })[0];
      var msg = { done: 'Prêt à lire', error: 'Échec de la création', cancelled: 'Création annulée' }[s.status];
      $('#status').textContent = msg || (active ? active.label.replace(/ — .*/, '') + '…' : 'En cours…');
      $('#miniStatus').textContent = $('#status').textContent;
      if (s.status === 'error') $('#alert').textContent = s.error || 'Une erreur est survenue.';
      if (s.status !== 'running') stopClock(s.elapsed); else { clockBase = s.elapsed || 0; clockStart = Date.now(); startClock(); }
    },
    setCover: function(uri){
      HUD._cover = uri; $('#coverImg').src = uri; $('#cover').classList.add('show');
    },
    setLink: function(ok){
      document.body.classList.toggle('lost', !ok);
      if (!ok) { $('#status').textContent = 'Liaison perdue, reconnexion…'; $('#miniStatus').textContent = $('#status').textContent; }
    },
    fail: function(msg){
      document.body.className = 'error'; $('#alert').textContent = msg; $('#status').textContent = 'Échec de la création'; stopClock(0);
    },
    toast: toast,
    exportCover: function(){
      if (!HUD._cover) { toast("La couverture n'est pas encore prête"); return; }
      var img = new Image();
      img.onload = function(){
        try {
          var c = document.createElement('canvas'); c.width = 1024; c.height = 1536;
          c.getContext('2d').drawImage(img, 0, 0, 1024, 1536);
          nativeCall('saveCover', c.toDataURL('image/png').split(',')[1]);
        } catch (e) { toast("Impossible d'exporter la couverture"); }
      };
      img.onerror = function(){ toast("Impossible d'exporter la couverture"); };
      img.src = HUD._cover;
    }
  };

  $('#btn-cancel').onclick = function(){ nativeCall('cancel'); };
  $('#btn-open').onclick = function(){ nativeCall('openBook'); };
  $('#btn-share').onclick = function(){ nativeCall('shareBook'); };
  $('#btn-png').onclick = function(){ HUD.exportCover(); };
  $('#btn-retry').onclick = function(){ nativeCall('retry'); };
  $('#btn-close').onclick = function(){ nativeCall('close'); };

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){ $('#mini').classList.toggle('on', !es[0].isIntersecting); }, {threshold: 0}).observe($('.reactor'));
  }
  nativeCall('ready');
})();
</script>
</body>
</html>
