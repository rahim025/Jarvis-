name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Créer local.properties avec les secrets
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> local.properties
          echo "APP_SHARED_SECRET=${{ secrets.APP_SHARED_SECRET }}" >> local.properties

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compiler l'APK debug
        run: gradle assembleDebug

      - name: Rendre l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
