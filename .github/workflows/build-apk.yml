name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérifier que la liste « Affiche les commandes » est à jour
        run: node scripts/check-commands.js

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Créer local.properties avec les secrets
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> local.properties
          echo "APP_SHARED_SECRET=${{ secrets.APP_SHARED_SECRET }}" >> local.properties

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Télécharger le modèle de suivi de la main et three.js (orbe)
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
          curl -L -o app/src/main/assets/three.min.js \
            https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js

      - name: Compiler l'APK debug
        run: gradle assembleDebug --stacktrace

      - name: Rendre l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
